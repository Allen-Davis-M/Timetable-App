name: Mirror to deployment repo

# Runs whenever main is pushed in this repo and pushes the same commits
# to arpithdavid/Timetable-App, which is what Railway/Vercel actually
# deploy from. Without this, changes pushed here would need a manual
# `git pull origin main && git push mine main` before they went live.
on:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend test suite
        run: pytest -q
        working-directory: backend

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend test suite
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  mirror:
    # Gates the mirror on both suites passing, so a commit that fails tests
    # or the production build can reach this repo's main branch (e.g. via a
    # quick fix pushed under pressure) without automatically reaching
    # Railway/Vercel. A broken main here just won't deploy until it's fixed;
    # it no longer ships itself.
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # actions/checkout persists the repo's own built-in GITHUB_TOKEN
          # as git credentials by default, and that takes priority over
          # any token embedded in a remote URL for github.com requests —
          # so the push below was silently authenticating as
          # github-actions[bot] (scoped only to *this* repo) instead of
          # MIRROR_TOKEN, and getting a 403 on the other repo. Disabling
          # this is what lets our own token actually be used.
          persist-credentials: false

      - name: Push to deployment repo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add deploy "https://x-access-token:${MIRROR_TOKEN}@github.com/arpithdavid/Timetable-App.git"
          git push deploy HEAD:main
